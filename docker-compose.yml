services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: sortedDb
      MYSQL_USER: tempUser
      MYSQL_PASSWORD: tempPassword
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: